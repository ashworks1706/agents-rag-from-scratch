# Keep the terminal quiet: Streamlit's file watcher logs a traceback for every
# transformers image module that imports torchvision (which we don't install).
# Dropping watcher warnings hides that noise while keeping hot-reload on save.
[logger]
level = "error"

# Run cleanly behind a reverse proxy (GitHub Codespaces port forwarding,
# Streamlit Community Cloud). Without these the websocket can fail to connect.
[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[theme]
base = "dark"
primaryColor = "#ffffff"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0a0a0a"
textColor = "#e6e6e6"
font = "monospace"
